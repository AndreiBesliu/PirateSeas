; The Water plugin's own collision profile. The plugin adds this itself when it
; is enabled from the editor's UI; this project was built entirely by script and
; never opened that UI, so the entry was never written and every run since has
; logged "Collision Profile settings do not include an entry for the Water Body
; Collision profile". The editor carried on and the complaint became scenery -
; tools/ci_measure.py even records that the editor's exit code is worthless
; BECAUSE of it. The cook does not carry on: it counts the error and refuses to
; make a build.
[/Script/Engine.CollisionProfile]
+Profiles=(Name="WaterBodyCollision",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore)),HelpMessage="Default Water Collision Profile (Created by Water Plugin)")
